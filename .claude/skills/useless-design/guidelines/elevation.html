<!-- dsCard(handoff copy) group="Spacing" viewport="700x190" subtitle="접지 1px + 확산 한 겹이 기본" name="그림자" -->
<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;font-family:var(--font-ui);background:var(--canvas);box-sizing:border-box}</style>
</head><body><div style="display:flex;gap:14px">
<div style="flex:1;height:96px;border-radius:var(--radius-card);background:var(--surface);box-shadow:var(--shadow-card);display:flex;align-items:flex-end;padding:10px;box-sizing:border-box"><span style="font:var(--type-caption);color:var(--ink-muted)">card</span></div>
<div style="flex:1;height:96px;border-radius:var(--radius-pill);background:var(--glass-fill);backdrop-filter:var(--glass-blur);border:.5px solid var(--glass-stroke);box-shadow:var(--shadow-glass);display:flex;align-items:flex-end;padding:10px;box-sizing:border-box"><span style="font:var(--type-caption);color:var(--ink-muted)">glass</span></div>
<div style="flex:1;height:96px;border-radius:var(--radius-pill);background:var(--ink);box-shadow:var(--shadow-cta);display:flex;align-items:flex-end;padding:10px;box-sizing:border-box"><span style="font:var(--type-caption);color:#fff">cta</span></div>
<div style="flex:1;height:96px;border-radius:var(--radius-pill);background:var(--lime);box-shadow:var(--shadow-accent);display:flex;align-items:flex-end;padding:10px;box-sizing:border-box"><span style="font:var(--type-caption);color:var(--lime-on-quiet)">accent</span></div>
</div></body></html>
